services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15
    container_name: flamenco_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flamenco_network

  # Supabase Auth (servicio de autenticación)
  auth:
    image: supabase/gotrue:v2.143.0
    container_name: flamenco_auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?search_path=auth,public
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_DB_SCHEMA: auth
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@flamencropuro.es
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: fake_mail_user
      GOTRUE_SMTP_PASS: fake_mail_password
      GOTRUE_SMTP_SENDER_NAME: Flamenco Sync Studio
    ports:
      - "9999:9999"
    depends_on:
      - db
    networks:
      - flamenco_network

  # Supabase REST API
  rest:
    image: postgrest/postgrest:v12.0.1
    container_name: flamenco_rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"
    ports:
      - "3001:3000"
    depends_on:
      - db
    networks:
      - flamenco_network

  # Supabase Realtime
  realtime:
    image: supabase/realtime:v2.25.35
    container_name: flamenco_realtime
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: your-super-secret-jwt-token-with-at-least-32-characters-long
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    ports:
      - "4000:4000"
    depends_on:
      - db
    networks:
      - flamenco_network

  # Supabase Meta (API de metadatos)
  meta:
    image: supabase/postgres-meta:v0.68.0
    container_name: flamenco_meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
    depends_on:
      - db
    networks:
      - flamenco_network

  # Supabase Studio (interfaz web)
  studio:
    image: supabase/studio:latest
    container_name: flamenco_studio
    restart: unless-stopped
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: postgres
      DEFAULT_ORGANIZATION_NAME: Flamenco Sync Studio
      DEFAULT_PROJECT_NAME: flamenco-sync-studio
    ports:
      - "3000:3000"
    depends_on:
      - meta
    networks:
      - flamenco_network

  # Kong API Gateway
  kong:
    image: kong:2.8.1
    container_name: flamenco_kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_VALID_TTL: "1"
      KONG_DNS_STALE_TTL: "0"
      KONG_UPSTREAM_KEEPALIVE: "60"
      KONG_UPSTREAM_CONNECT_TIMEOUT: "60000"
      KONG_UPSTREAM_SEND_TIMEOUT: "60000"
      KONG_UPSTREAM_READ_TIMEOUT: "60000"
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    ports:
      - "8000:8000"
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - auth
      - rest
      - realtime
    networks:
      - flamenco_network

  # Supabase Edge Functions Runtime (local)
  functions:
    image: node:22-alpine
    container_name: flamenco_functions
    restart: unless-stopped
    working_dir: /srv
    command: sh -c "npm install --omit=dev && node index.mjs"
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
    volumes:
      - ./edge-local:/srv
    ports:
      - "54321:54321"
    depends_on:
      - kong
    networks:
      - flamenco_network

volumes:
  postgres_data:
    driver: local

networks:
  flamenco_network:
    driver: bridge